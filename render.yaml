services:
  - type: web
    name: bookleaf-support-portal
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 7860
      - key: JWT_SECRET
        value: bookleaf_super_secret_jwt_key_2026_secure
      - key: DATABASE_URL
        value: file:./dev.db
      - key: CLIENT_ORIGIN
        value: "*"
      - key: AI_PROVIDER
        value: gemini
